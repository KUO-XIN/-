<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>幸運抽獎</title>


    <style>

        /* =====================================================
           基本
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        :root {

            --primary: #ff7043;
            --primary-dark: #e85a30;

            --background1: #fff8ed;
            --background2: #ffe7c4;

            --text: #43342d;
            --sub-text: #8f7d72;

            --card: rgba(255, 255, 255, 0.96);

            --shadow:
                0 16px 45px
                rgba(90, 50, 20, 0.15);
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;

            color: var(--text);

            background:

                radial-gradient(
                    circle at 10% 10%,
                    rgba(255, 198, 89, 0.35),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 90% 15%,
                    rgba(255, 114, 78, 0.22),
                    transparent 25%
                ),

                linear-gradient(
                    135deg,
                    var(--background1),
                    var(--background2)
                );

            overflow-x: hidden;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }



        /* =====================================================
           外層
        ===================================================== */

        .container {

            width:
                min(
                    1200px,
                    calc(100% - 30px)
                );

            margin: 0 auto;

            padding:
                28px
                0
                40px;
        }



        /* =====================================================
           Header
        ===================================================== */

        .header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 22px;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 14px;
        }


        .brand-icon {

            width: 55px;

            height: 55px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 17px;

            font-size: 28px;

            background:
                linear-gradient(
                    135deg,
                    #ffd45d,
                    #ff7145
                );

            box-shadow:
                0 9px 22px
                rgba(235, 103, 45, 0.25);
        }


        .brand-title {

            margin: 0;

            font-size: 34px;

            letter-spacing: 2px;
        }


        .brand-subtitle {

            margin:
                4px
                0
                0;

            color:
                var(--sub-text);

            font-size: 14px;
        }


        .settings-button {

            border: none;

            background: white;

            color:
                var(--text);

            padding:
                11px
                17px;

            border-radius: 13px;

            font-weight: bold;

            box-shadow:
                0 7px 20px
                rgba(70,40,20,0.10);

            transition:
                0.2s;
        }


        .settings-button:hover {

            transform:
                translateY(-2px);
        }



        /* =====================================================
           主版面
        ===================================================== */

        .main-layout {

            display: grid;

            grid-template-columns:
                minmax(0, 1.5fr)
                minmax(300px, 0.75fr);

            gap: 22px;
        }


        .card {

            background:
                var(--card);

            border-radius: 25px;

            border:
                1px
                solid
                rgba(255,255,255,0.8);

            box-shadow:
                var(--shadow);
        }



        /* =====================================================
           抽獎區
        ===================================================== */

        .draw-card {

            min-height: 700px;

            padding: 28px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        .prize-badge {

            background:
                #fff2d5;

            border:
                1px
                solid
                #ffd998;

            color:
                #c96d19;

            border-radius: 999px;

            padding:
                7px
                15px;

            font-size: 14px;

            font-weight: 800;

            margin-bottom: 8px;
        }


        .prize-title {

            margin: 0;

            font-size:
                clamp(
                    30px,
                    5vw,
                    44px
                );

            letter-spacing: 4px;
        }


        .prize-count {

            margin:
                7px
                0
                18px;

            color:
                var(--sub-text);

            font-size: 15px;
        }



        /* =====================================================
           轉盤區域
        ===================================================== */

        .wheel-container {

            width:
                min(
                    500px,
                    82vw
                );

            aspect-ratio: 1;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 20px;
        }



        /* =====================================================
           轉盤
        ===================================================== */

        .wheel {

            position: relative;

            width: 100%;

            height: 100%;

            border-radius: 50%;

            border:
                11px
                solid
                white;

            overflow: hidden;

            background:
                #f8f2ed;

            box-shadow:

                0 15px 38px
                rgba(85,48,23,0.22),

                inset
                0 0 0
                2px
                rgba(60,30,10,0.10);

            /*
                旋轉中心固定為正中央
            */

            transform-origin:
                center center;

            transform:
                rotate(0deg);

            transition:
                transform
                4s
                cubic-bezier(
                    0.12,
                    0.72,
                    0.14,
                    1
                );
        }


        .wheel-labels {

            position: absolute;

            inset: 0;

            border-radius: 50%;

            pointer-events: none;
        }


        /*
            注意：

            名字現在不是靠 rotate() 排列。

            每個名字直接算自己的圓周座標，
            因此一定會在對應扇形中央。
        */

        .wheel-label {

            position: absolute;

            transform:
                translate(
                    -50%,
                    -50%
                );

            color: white;

            font-weight: 900;

            text-align: center;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            text-shadow:
                0
                2px
                3px
                rgba(0,0,0,0.30);

            /*
                不再設定 transform-origin。

                因為現在名字本身不需要旋轉。
            */
        }



        /* =====================================================
           ▼ 指針

           尖端朝下。
        ===================================================== */

        .wheel-pointer {

            position: absolute;

            z-index: 20;

            top: -11px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 0;

            height: 0;

            /*
                border-top 有顏色
                → 尖端朝下
            */

            border-left:
                21px
                solid
                transparent;

            border-right:
                21px
                solid
                transparent;

            border-top:
                43px
                solid
                #e94732;

            border-bottom:
                0
                solid
                transparent;

            filter:
                drop-shadow(
                    0
                    5px
                    3px
                    rgba(70,30,15,0.25)
                );
        }


        /*
            指針上方的小白色裝飾。
        */

        .wheel-pointer::before {

            content: "";

            position: absolute;

            left: -10px;

            top: -42px;

            width: 20px;

            height: 6px;

            border-radius: 5px;

            background:
                white;
        }



        /* =====================================================
           中央
        ===================================================== */

        .wheel-center {

            position: absolute;

            z-index: 10;

            width: 72px;

            height: 72px;

            border-radius: 50%;

            border:
                6px
                solid
                white;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #ffe5b6
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

            box-shadow:
                0
                5px
                16px
                rgba(
                    60,
                    30,
                    10,
                    0.23
                );
        }



        /* =====================================================
           空轉盤
        ===================================================== */

        .wheel-empty {

            position: absolute;

            inset: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            flex-direction: column;

            text-align: center;

            background:
                #f8f2ed;

            color:
                #9f8d82;

            font-weight:
                bold;

            line-height:
                1.8;
        }


        .wheel-empty-icon {

            font-size:
                46px;

            margin-bottom:
                5px;
        }



        /* =====================================================
           開始按鈕
        ===================================================== */

        .start-button {

            min-width:
                220px;

            border:
                none;

            padding:
                14px
                28px;

            border-radius:
                15px;

            color:
                white;

            font-size:
                18px;

            font-weight:
                900;

            background:
                linear-gradient(
                    135deg,
                    #ff7745,
                    #ff514c
                );

            box-shadow:
                0
                10px
                24px
                rgba(
                    232,
                    91,
                    45,
                    0.30
                );

            transition:
                0.2s;
        }


        .start-button:hover:not(:disabled) {

            transform:
                translateY(-2px)
                scale(1.01);
        }


        .start-button:disabled {

            opacity:
                0.45;

            cursor:
                not-allowed;

            box-shadow:
                none;
        }


        .status {

            min-height:
                23px;

            margin-top:
                11px;

            color:
                var(--sub-text);

            font-size:
                14px;

            text-align:
                center;
        }


        .spin-lock-note {

            margin-top:
                7px;

            color:
                #b28b72;

            font-size:
                12px;

            text-align:
                center;
        }



        /* =====================================================
           名單
        ===================================================== */

        .list-card {

            min-height:
                700px;

            padding:
                23px;

            display:
                flex;

            flex-direction:
                column;
        }


        .list-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            margin-bottom:
                15px;
        }


        .list-header h2 {

            margin:
                0;

            font-size:
                21px;
        }


        .person-count {

            padding:
                5px
                10px;

            border-radius:
                999px;

            background:
                #fff0dd;

            color:
                #c96c20;

            font-size:
                13px;

            font-weight:
                800;
        }


        .add-button {

            width:
                100%;

            border:
                2px
                dashed
                #ffc77c;

            background:
                #fffaf2;

            color:
                #c66a16;

            border-radius:
                13px;

            padding:
                11px;

            font-weight:
                800;

            margin-bottom:
                12px;

            transition:
                0.2s;
        }


        .add-button:hover {

            background:
                #fff2da;
        }


        .name-list {

            flex:
                1;

            overflow-y:
                auto;

            padding-right:
                4px;
        }


        .name-list::-webkit-scrollbar {

            width:
                7px;
        }


        .name-list::-webkit-scrollbar-thumb {

            background:
                #e8c7a5;

            border-radius:
                10px;
        }


        .name-row {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            padding:
                10px;

            border-bottom:
                1px solid
                #f1e5da;
        }


        .name-number {

            width:
                25px;

            color:
                #b4a095;

            font-size:
                12px;
        }


        .name-text {

            flex:
                1;

            overflow:
                hidden;

            white-space:
                nowrap;

            text-overflow:
                ellipsis;
        }


        .remove-button {

            width:
                28px;

            height:
                28px;

            border:
                none;

            border-radius:
                9px;

            background:
                #fff0ef;

            color:
                #df5c56;

            font-size:
                18px;

            font-weight:
                bold;
        }


        .remove-button:hover {

            background:
                #ffe0dd;
        }


        .empty-list {

            min-height:
                250px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            color:
                #a79388;

            line-height:
                1.8;
        }


        .empty-list-icon {

            font-size:
                40px;

            margin-bottom:
                5px;
        }



        /* =====================================================
           Modal
        ===================================================== */

        .modal-overlay {

            position:
                fixed;

            inset:
                0;

            z-index:
                100;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                18px;

            background:
                rgba(
                    49,
                    29,
                    18,
                    0.48
                );

            backdrop-filter:
                blur(5px);

            opacity:
                0;

            visibility:
                hidden;

            transition:
                0.2s;
        }


        .modal-overlay.show {

            opacity:
                1;

            visibility:
                visible;
        }


        .modal {

            width:
                min(
                    510px,
                    100%
                );

            background:
                white;

            border-radius:
                25px;

            padding:
                28px;

            box-shadow:
                0
                25px
                70px
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );

            transform:
                translateY(12px)
                scale(0.98);

            transition:
                0.22s;
        }


        .modal-overlay.show .modal {

            transform:
                translateY(0)
                scale(1);
        }


        .modal-title {

            margin:
                0
                0
                7px;

            font-size:
                24px;
        }


        .modal-description {

            margin:
                0
                0
                18px;

            color:
                var(--sub-text);

            font-size:
                14px;
        }


        .text-input {

            width:
                100%;

            padding:
                12px
                14px;

            border:
                2px
                solid
                #eaded5;

            border-radius:
                12px;

            outline:
                none;

            color:
                var(--text);

            background:
                white;
        }


        .text-input:focus {

            border-color:
                #ffad65;

            box-shadow:
                0
                0
                0
                4px
                rgba(
                    255,
                    173,
                    101,
                    0.15
                );
        }



        /* =====================================================
           設定
        ===================================================== */

        .settings-list {

            display:
                grid;

            gap:
                12px;
        }


        .settings-row {

            display:
                grid;

            grid-template-columns:
                1fr
                95px;

            gap:
                10px;

            align-items:
                center;
        }


        .settings-label {

            font-weight:
                800;
        }


        .settings-row small {

            display:
                block;

            margin-top:
                2px;

            color:
                var(--sub-text);

            font-weight:
                normal;
        }


        .number-input {

            text-align:
                center;
        }


        .settings-divider {

            height:
                1px;

            margin:
                4px
                0;

            background:
                #eee2d8;
        }



        /* =====================================================
           Modal 按鈕
        ===================================================== */

        .modal-buttons {

            display:
                flex;

            justify-content:
                flex-end;

            gap:
                10px;

            margin-top:
                22px;
        }


        .secondary-button,
        .modal-primary-button {

            border:
                none;

            padding:
                11px
                17px;

            border-radius:
                12px;

            font-weight:
                800;
        }


        .secondary-button {

            background:
                #f3ece7;

            color:
                #66544a;
        }


        .secondary-button:hover {

            background:
                #e8ded7;
        }


        .modal-primary-button {

            background:
                linear-gradient(
                    135deg,
                    #ff7745,
                    #ff514c
                );

            color:
                white;
        }



        /* =====================================================
           中獎視窗
        ===================================================== */

        .winner-modal {

            text-align:
                center;

            padding:
                34px
                28px
                28px;
        }


        .winner-emoji {

            font-size:
                50px;

            animation:
                winnerPop
                0.45s
                ease;
        }


        @keyframes winnerPop {

            0% {

                transform:
                    scale(0.5);

                opacity:
                    0;
            }

            70% {

                transform:
                    scale(1.12);
            }

            100% {

                transform:
                    scale(1);

                opacity:
                    1;
            }

        }


        .winner-title {

            margin-top:
                4px;

            font-size:
                25px;

            font-weight:
                900;
        }


        .winner-prize {

            margin-top:
                4px;

            margin-bottom:
                18px;

            color:
                var(--sub-text);
        }


        .winner-list {

            display:
                grid;

            gap:
                8px;

            max-height:
                280px;

            overflow-y:
                auto;

            margin-bottom:
                20px;
        }


        .winner-name {

            padding:
                11px;

            border-radius:
                13px;

            background:
                linear-gradient(
                    135deg,
                    #fff8eb,
                    #fff0d7
                );

            border:
                1px
                solid
                #ffe0a8;

            font-size:
                19px;

            font-weight:
                900;
        }


        .continue-button {

            width:
                100%;
        }



        /* =====================================================
           提醒
        ===================================================== */

        .notice-modal {

            text-align:
                center;
        }


        .notice-icon {

            font-size:
                44px;
        }


        .notice-text {

            margin-top:
                12px;

            color:
                #6c5a50;

            line-height:
                1.8;
        }


        .notice-modal
        .modal-buttons {

            justify-content:
                center;
        }


        .notice-ok {

            min-width:
                110px;
        }



        /* =====================================================
           彩帶
        ===================================================== */

        .confetti-container {

            position:
                fixed;

            inset:
                0;

            z-index:
                90;

            pointer-events:
                none;

            overflow:
                hidden;
        }


        .confetti {

            position:
                absolute;

            top:
                -25px;

            opacity:
                0;

            animation:
                confettiFall
                1.8s
                ease-out
                forwards;
        }


        @keyframes confettiFall {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity:
                    1;
            }

            100% {

                transform:
                    translateY(105vh)
                    rotate(720deg);

                opacity:
                    0;
            }

        }



        /* =====================================================
           手機
        ===================================================== */

        @media (max-width: 900px) {

            .main-layout {

                grid-template-columns:
                    1fr;
            }


            .draw-card,
            .list-card {

                min-height:
                    auto;
            }


            .list-card {

                min-height:
                    390px;
            }


            .name-list {

                max-height:
                    300px;
            }

        }


        @media (max-width: 560px) {

            .container {

                width:
                    calc(100% - 20px);

                padding-top:
                    15px;
            }


            .brand-icon {

                width:
                    46px;

                height:
                    46px;

                font-size:
                    23px;

                border-radius:
                    14px;
            }


            .brand-title {

                font-size:
                    26px;
            }


            .brand-subtitle {

                display:
                    none;
            }


            .settings-button {

                padding:
                    9px
                    12px;
            }


            .draw-card,
            .list-card {

                border-radius:
                    20px;
            }


            .draw-card {

                padding:
                    20px
                    12px
                    24px;
            }


            .wheel-container {

                width:
                    min(
                        390px,
                        90vw
                    );
            }


            .wheel-center {

                width:
                    60px;

                height:
                    60px;

                font-size:
                    22px;
            }


            .wheel-pointer {

                border-left-width:
                    15px;

                border-right-width:
                    15px;

                border-top-width:
                    31px;

                top:
                    -9px;
            }


            .wheel-pointer::before {

                left:
                    -7px;

                top:
                    -30px;

                width:
                    14px;

                height:
                    5px;
            }


            .start-button {

                min-width:
                    190px;
            }


            .settings-row {

                grid-template-columns:
                    1fr
                    85px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         Header
    ===================================================== -->

    <header class="header">


        <div class="brand">


            <div class="brand-icon">
                🎉
            </div>


            <div>


                <h1 class="brand-title">
                    幸運抽獎
                </h1>


                <p class="brand-subtitle">
                    看看今天的幸運兒是誰！
                </p>


            </div>


        </div>


        <button
            class="settings-button"
            id="settingsButton"
        >
            ⚙ 設定
        </button>


    </header>



    <!-- =====================================================
         主畫面
    ===================================================== -->

    <main class="main-layout">


        <!-- =================================================
             抽獎
        ================================================= -->

        <section class="card draw-card">


            <div
                class="prize-badge"
                id="prizeBadge"
            >
                第一獎項
            </div>


            <h2
                class="prize-title"
                id="prizeTitle"
            >
                大獎
            </h2>


            <div
                class="prize-count"
                id="prizeCount"
            >
                本次抽出 1 人
            </div>



            <!-- =================================================
                 轉盤
            ================================================= -->

            <div class="wheel-container">


                <!-- ▼ 指針 -->

                <div class="wheel-pointer"></div>


                <!-- 轉盤 -->

                <div
                    class="wheel"
                    id="wheel"
                >


                    <!-- 沒有參加者 -->

                    <div
                        class="wheel-empty"
                        id="wheelEmpty"
                    >

                        <div>

                            <div
                                class="wheel-empty-icon"
                            >
                                🎡
                            </div>


                            <div>
                                加入參加者後<br>
                                就可以開始抽獎
                            </div>

                        </div>

                    </div>


                    <!-- 名字 -->

                    <div
                        class="wheel-labels"
                        id="wheelLabels"
                    ></div>


                </div>


                <!-- 中央 -->

                <div class="wheel-center">
                    🎁
                </div>


            </div>



            <!-- 開始 -->

            <button

<script>


/* =============================================================
   狀態
============================================================= */

const state = {


    /*
        參加者。

        每個人都有獨立 ID，
        所以姓名可以重複。
    */

    participants: [],


    /*
        一輪抽獎開始時，
        保存需要在最後恢復的參加者。

        如果中途新增名字，
        也會加入這裡。

        如果中途手動刪除名字，
        也會從這裡刪掉。
    */

    roundRestoreParticipants: [],


    /*
        是否已經開始一輪抽獎。
    */

    roundActive: false,


    /*
        三個獎項。
    */

    prizes: [

        {
            name: "大獎",
            count: 1
        },

        {
            name: "二獎",
            count: 3
        },

        {
            name: "三獎",
            count: 5
        }

    ],


    /*
        目前獎項。

        0 = 大獎
        1 = 二獎
        2 = 三獎
    */

    currentPrizeIndex: 0,


    /*
        目前獎項已經抽幾人。
    */

    currentPrizeDrawn: 0,


    /*
        目前獎項得獎者。
    */

    currentPrizeWinners: [],


    /*
        是否正在轉。
    */

    spinning: false,


    /*
        轉盤累積旋轉角度。
    */

    wheelRotation: 0,


    /*
        下一個 ID。
    */

    nextId: 1

};



/* =============================================================
   DOM
============================================================= */

const wheel =
    document.getElementById(
        "wheel"
    );


const wheelLabels =
    document.getElementById(
        "wheelLabels"
    );


const wheelEmpty =
    document.getElementById(
        "wheelEmpty"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const status =
    document.getElementById(
        "status"
    );


const personCount =
    document.getElementById(
        "personCount"
    );


const nameList =
    document.getElementById(
        "nameList"
    );


const prizeTitle =
    document.getElementById(
        "prizeTitle"
    );


const prizeBadge =
    document.getElementById(
        "prizeBadge"
    );


const prizeCount =
    document.getElementById(
        "prizeCount"
    );


const spinLockNote =
    document.getElementById(
        "spinLockNote"
    );



/* =============================================================
   顏色
============================================================= */

const wheelColors = [

    "#ff8066",
    "#ffb84d",
    "#f5cf55",
    "#65c98b",
    "#52b9c7",
    "#609eea",
    "#8b82dc",
    "#c879cf"

];



/* =============================================================
   Modal
============================================================= */

function openModal(id) {

    document
        .getElementById(id)
        .classList
        .add("show");

}


function closeModal(id) {

    document
        .getElementById(id)
        .classList
        .remove("show");

}


document
    .querySelectorAll(
        "[data-close]"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                closeModal(
                    button.dataset.close
                );

            }
        );

    });



/* =============================================================
   HTML Escape
============================================================= */

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* =============================================================
   提醒視窗
============================================================= */

function showNotice(
    title,
    message,
    icon = "⚠️"
) {

    document.getElementById(
        "noticeTitle"
    ).textContent =
        title;


    document.getElementById(
        "noticeText"
    ).innerHTML =
        message;


    document.getElementById(
        "noticeIcon"
    ).textContent =
        icon;


    openModal(
        "noticeModal"
    );

}


document
    .getElementById(
        "noticeOkButton"
    )
    .addEventListener(
        "click",
        () => {

            closeModal(
                "noticeModal"
            );

        }
    );



/* =============================================================
   建立參加者
============================================================= */

function createParticipant(name) {

    return {

        id:
            state.nextId++,

        name:
            name

    };

}



/* =============================================================
   新增名字
============================================================= */

const addButton =
    document.getElementById(
        "addButton"
    );


const nameInput =
    document.getElementById(
        "nameInput"
    );


addButton.addEventListener(
    "click",
    () => {


        /*
            只有正在轉盤的 4 秒不能新增。
        */

        if (
            state.spinning
        ) {

            showNotice(
                "轉盤正在旋轉",
                "請等轉盤停止後再新增參加者。",
                "🎡"
            );

            return;

        }


        nameInput.value =
            "";


        openModal(
            "addModal"
        );


        setTimeout(
            () => {

                nameInput.focus();

            },
            100
        );

    }
);



function addName() {


    const name =
        nameInput.value.trim();


    if (
        !name
    ) {

        nameInput.focus();

        return;

    }


    /*
        名字允許重複。
    */

    const participant =
        createParticipant(
            name
        );


    state.participants.push(
        participant
    );


    /*
        如果已經在一輪抽獎，
        新人也要在最後恢復。
    */

    if (
        state.roundActive
    ) {

        state.roundRestoreParticipants.push(
            participant
        );

    }


    nameInput.value =
        "";


    closeModal(
        "addModal"
    );


    renderNames();

    renderWheel();

    updateInterface();

}


document
    .getElementById(
        "confirmAddButton"
    )
    .addEventListener(
        "click",
        addName
    );


nameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            addName();

        }


        if (
            event.key === "Escape"
        ) {

            closeModal(
                "addModal"
            );

        }

    }
);



/* =============================================================
   顯示名單
============================================================= */

function renderNames() {


    personCount.textContent =
        `${state.participants.length} 人`;


    /*
        沒有參加者。
    */

    if (
        state.participants.length === 0
    ) {

        nameList.innerHTML = `

            <div class="empty-list">

                <div>

                    <div class="empty-list-icon">
                        👥
                    </div>

                    <div>
                        目前沒有參加者<br>
                        請按「＋ 新增名字」
                    </div>

                </div>

            </div>

        `;

        return;

    }


    /*
        建立名單。
    */

    nameList.innerHTML =
        state.participants
            .map(
                (
                    participant,
                    index
                ) => `

                    <div class="name-row">

                        <div class="name-number">
                            ${String(
                                index + 1
                            ).padStart(2, "0")}
                        </div>


                        <div
                            class="name-text"
                            title="${escapeHTML(
                                participant.name
                            )}"
                        >
                            ${escapeHTML(
                                participant.name
                            )}
                        </div>


                        <button
                            class="remove-button"
                            data-id="${participant.id}"
                            title="刪除"
                        >
                            ×
                        </button>

                    </div>

                `
            )
            .join("");


    /*
        綁定刪除。
    */

    document
        .querySelectorAll(
            ".remove-button"
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {


                    /*
                        正在轉盤時禁止修改。
                    */

                    if (
                        state.spinning
                    ) {

                        showNotice(
                            "轉盤正在旋轉",
                            "請等轉盤停止後再修改參加者名單。",
                            "🎡"
                        );

                        return;

                    }


                    const id =
                        Number(
                            button.dataset.id
                        );


                    const index =
                        state.participants.findIndex(
                            participant =>
                                participant.id === id
                        );


                    if (
                        index === -1
                    ) {

                        return;

                    }


                    /*
                        如果是一輪抽獎中，
                        手動刪除的人最後也不要恢復。
                    */

                    if (
                        state.roundActive
                    ) {

                        state.roundRestoreParticipants =
                            state.roundRestoreParticipants
                                .filter(
                                    participant =>
                                        participant.id !== id
                                );

                    }


                    state.participants.splice(
                        index,
                        1
                    );


                    renderNames();

                    renderWheel();

                    updateInterface();

                }
            );

        });

}



/* =============================================================
   轉盤
============================================================= */

function renderWheel(
    customParticipants = null
) {


    const participants =
        customParticipants ||
        state.participants;


    wheelLabels.innerHTML =
        "";


    /*
        空轉盤。
    */

    if (
        participants.length === 0
    ) {

        wheelEmpty.style.display =
            "flex";


        wheel.style.background =
            "#f8f2ed";


        return;

    }


    wheelEmpty.style.display =
        "none";


    const total =
        participants.length;


    /*
        一個扇形的角度。
    */

    const segmentAngle =
        360 /
        total;


    const gradients = [];


    /*
        建立每個扇形。
    */

    for (
        let i = 0;
        i < total;
        i++
    ) {

        gradients.push(

            `${wheelColors[
                i %
                wheelColors.length
            ]}
            ${i * segmentAngle}deg
            ${(i + 1) * segmentAngle}deg`

        );

    }


    wheel.style.background =
        `conic-gradient(
            from 0deg,
            ${gradients.join(",")}
        )`;



    /* =====================================================
       文字大小
    ===================================================== */

    let fontSize;


    if (
        total <= 10
    ) {

        fontSize = 18;

    }
    else if (
        total <= 20
    ) {

        fontSize = 14;

    }
    else if (
        total <= 35
    ) {

        fontSize = 11;

    }
    else if (
        total <= 60
    ) {

        fontSize = 8;

    }
    else {

        fontSize = 6;

    }



    /* =====================================================
       名字位置

       這裡是這次最重要的修正。

       angle = 0
       → 正上方

       angle = 90
       → 正右方

       angle = 180
       → 正下方

       angle = 270
       → 正左方

       因此：

           x = sin(angle)
           y = -cos(angle)

       這跟 conic-gradient 的角度完全一致。
    ===================================================== */

    participants.forEach(
        (
            participant,
            index
        ) => {


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "wheel-label";


            label.textContent =
                participant.name;


            /*
                扇形中心。
            */

            const angle =
                (
                    index *
                    segmentAngle
                ) +
                (
                    segmentAngle /
                    2
                );


            const radians =
                angle *
                Math.PI /
                180;


            /*
                名字放在距離圓心約 32%
                的地方。

                這個位置會落在自己的扇形中央。
            */

            const radius =
                32;


            const x =
                50 +
                (
                    Math.sin(
                        radians
                    ) *
                    radius
                );


            const y =
                50 -
                (
                    Math.cos(
                        radians
                    ) *
                    radius
                );


            label.style.left =
                `${x}%`;


            label.style.top =
                `${y}%`;


            label.style.fontSize =
                `${fontSize}px`;


            /*
                保證名字中心正好落在
                計算出來的位置。
            */

            label.style.transform =
                "translate(-50%, -50%)";


            wheelLabels.appendChild(
                label
            );

        }
    );

}



/* =============================================================
   更新主介面
============================================================= */

function updateInterface() {


    const prize =
        state.prizes[
            state.currentPrizeIndex
        ];


    prizeTitle.textContent =
        prize.name;


    prizeBadge.textContent =
        `第 ${state.currentPrizeIndex + 1} 獎項`;


    prizeCount.textContent =
        `本次抽出 ${prize.count} 人`;


    /*
        沒人。
    */

    if (
        state.participants.length === 0
    ) {

        status.textContent =
            "目前沒有參加者";


        startButton.disabled =
            true;


        return;

    }


    /*
        目前還需要抽幾個人。
    */

    const remaining =
        prize.count -
        state.currentPrizeDrawn;


    /*
        人數不足。

        只鎖開始按鈕，
        不鎖設定與新增。
    */

    if (
        state.participants.length <
        remaining
    ) {

        status.textContent =
            `目前剩餘 ${state.participants.length} 人，還需要 ${remaining} 人`;


        startButton.disabled =
            true;


        return;

    }


    status.textContent =
        `目前剩餘 ${state.participants.length} 人`;


    startButton.disabled =
        state.spinning;

}



/* =============================================================
   設定
============================================================= */

document
    .getElementById(
        "settingsButton"
    )
    .addEventListener(
        "click",
        () => {


            /*
                只有轉盤正在轉的 4 秒不能修改。
            */

            if (
                state.spinning
            ) {

                showNotice(
                    "轉盤正在旋轉",
                    "請等轉盤停止後再修改設定。",
                    "🎡"
                );

                return;

            }


            state.prizes.forEach(
                (
                    prize,
                    index
                ) => {


                    document.getElementById(
                        `prizeName${index}`
                    ).value =
                        prize.name;


                    document.getElementById(
                        `prizeCount${index}`
                    ).value =
                        prize.count;

                }
            );


            openModal(
                "settingsModal"
            );

        }
    );



/* =============================================================
   儲存設定
============================================================= */

document
    .getElementById(
        "saveSettingsButton"
    )
    .addEventListener(
        "click",
        () => {


            const newPrizes =
                [];


            for (
                let i = 0;
                i < 3;
                i++
            ) {


                const name =
                    document.getElementById(
                        `prizeName${i}`
                    )
                    .value
                    .trim();


                const count =
                    Math.floor(
                        Number(
                            document.getElementById(
                                `prizeCount${i}`
                            ).value
                        )
                    );


                /*
                    名稱不能空白。
                */

                if (
                    !name
                ) {

                    showNotice(
                        "設定錯誤",
                        `第 ${i + 1} 個獎項名稱不能是空白。`
                    );

                    return;

                }


                /*
                    至少抽一人。
                */

                if (
                    !Number.isFinite(
                        count
                    ) ||
                    count < 1
                ) {

                    showNotice(
                        "設定錯誤",
                        `第 ${i + 1} 個獎項至少需要抽出 1 人。`
                    );

                    return;

                }


                /*
                    目前獎項如果已經抽了部分，
                    不能把總人數改得更少。
                */

                if (
                    i ===
                    state.currentPrizeIndex &&

                    count <
                    state.currentPrizeDrawn
                ) {

                    showNotice(
                        "無法修改人數",
                        `「${escapeHTML(
                            state.prizes[i].name
                        )}」已經抽出 <b>${
                            state.currentPrizeDrawn
                        }</b> 人，因此不能設定成少於這個數字。`
                    );

                    return;

                }


                newPrizes.push({

                    name:
                        name,

                    count:
                        count

                });

            }


            state.prizes =
                newPrizes;


            closeModal(
                "settingsModal"
            );


            updateInterface();

        }
    );



/* =============================================================
   隨機抽一個參加者
============================================================= */

function chooseRandomParticipantIndex() {


    if (
        state.participants.length === 0
    ) {

        return -1;

    }


    /*
        每一個參加者的索引機率相同。
    */

    return Math.floor(
        Math.random() *
        state.participants.length
    );

}



/* =============================================================
   開始一輪
============================================================= */

function startRoundIfNeeded() {


    if (
        state.roundActive
    ) {

        return;

    }


    /*
        保存這一輪開始時的全部參加者。
    */

    state.roundRestoreParticipants =
        [...state.participants];


    state.roundActive =
        true;

}



/* =============================================================
   開始抽獎按鈕
============================================================= */

startButton.addEventListener(
    "click",
    () => {


        if (
            state.spinning
        ) {

            return;

        }


        const prize =
            state.prizes[
                state.currentPrizeIndex
            ];


        /*
            開始本輪。
        */

        startRoundIfNeeded();


        /*
            還需要多少人。
        */

        const remaining =
            prize.count -
            state.currentPrizeDrawn;


        /*
            如果目前人數不夠。
        */

        if (
            state.participants.length <
            remaining
        ) {

            showNotice(
                "參加者人數不足",
                `「${escapeHTML(
                    prize.name
                )}」還需要抽出 <b>${remaining}</b> 人，但目前只有 <b>${state.participants.length}</b> 人。<br><br>你可以新增參加者，或到「設定」修改抽出人數。`,
                "⚠️"
            );

            return;

        }


        /*
            開始第一次轉盤。
        */

        spinOnce();

    }
);



/* =============================================================
   單次轉盤
============================================================= */

function spinOnce() {


    if (
        state.participants.length === 0
    ) {

        return;

    }


    /*
        抽獎開始前的名單。

        這個名單就是目前轉盤上
        真正存在的所有人。
    */

    const participantsBefore =
        [...state.participants];


    /*
        隨機選人。

        注意：
        這一步先決定真正的中獎者。
    */

    const winnerIndex =
        chooseRandomParticipantIndex();


    if (
        winnerIndex === -1
    ) {

        return;

    }


    const winner =
        participantsBefore[
            winnerIndex
        ];



    /* =====================================================
       建立目前轉盤
    ===================================================== */

    renderWheel(
        participantsBefore
    );



    /* =====================================================
       計算中獎扇形
    ===================================================== */

    const total =
        participantsBefore.length;


    const segmentAngle =
        360 /
        total;


    /*
        該扇形中心角。

        0deg = 正上方
        90deg = 右方
        180deg = 下方
        270deg = 左方
    */

    const winnerCenterAngle =
        winnerIndex *
        segmentAngle +
        segmentAngle / 2;



    /* =====================================================
       計算轉盤應該停在哪裡

       最終希望：

       winnerCenterAngle
       +
       wheelRotation

       ≡ 0 (mod 360)

       所以：

       wheelRotation
       =
       360 - winnerCenterAngle
    ===================================================== */

    const targetAngle =
        (
            360 -
            winnerCenterAngle
        ) % 360;


    /*
        現在轉盤的角度。
    */

    const currentAngle =
        (
            state.wheelRotation %
            360 +
            360
        ) % 360;


    /*
        從目前位置走到 target
        需要增加幾度。
    */

    let difference =
        targetAngle -
        currentAngle;


    if (
        difference < 0
    ) {

        difference += 360;

    }


    /*
        固定增加 6 圈。

        沒有任何額外 random angle。

        因此：

        抽到誰
        ↓
        計算誰的位置
        ↓
        精準停在誰身上
    */

    const extraRotations =
        6 * 360;


    state.wheelRotation +=
        extraRotations +
        difference;


    /*
        鎖定轉盤。
    */

    state.spinning =
        true;


    startButton.disabled =
        true;


    spinLockNote.style.display =
        "block";


    status.textContent =
        "抽獎進行中……";


    /*
        開始動畫。

        4 秒。
    */

    wheel.style.transition =
        "transform 4s cubic-bezier(0.12, 0.72, 0.14, 1)";


    wheel.style.transform =
        `rotate(${state.wheelRotation}deg)`;


    /*
        動畫完成。
    */

    setTimeout(
        () => {

            finishOneSpin(
                winner
            );

        },
        4050
    );

}



/* =============================================================
   一次轉盤完成
============================================================= */

function finishOneSpin(
    winner
) {


    /*
        現在轉盤已經停止。

        此刻指針一定指向 winner。

        現在才從名單移除。
    */

    const winnerIndex =
        state.participants.findIndex(
            participant =>
                participant.id ===
                winner.id
        );


    if (
        winnerIndex !== -1
    ) {

        state.participants.splice(
            winnerIndex,
            1
        );

    }


    /*
        紀錄這次中獎者。
    */

    state.currentPrizeWinners.push(
        winner
    );


    state.currentPrizeDrawn++;


    state.spinning =
        false;


    spinLockNote.style.display =
        "none";


    /*
        更新右側名單。
    */

    renderNames();


    /*
        取得目前獎項。
    */

    const prize =
        state.prizes[
            state.currentPrizeIndex
        ];


    /*
        =====================================================
        還沒抽完
        =====================================================
    */

    if (
        state.currentPrizeDrawn <
        prize.count
    ) {


        const remaining =
            prize.count -
            state.currentPrizeDrawn;


        /*
            如果使用者在前面修改名單，
            導致人數不足。
        */

        if (
            state.participants.length <
            remaining
        ) {

            updateInterface();


            showNotice(
                "參加者人數不足",
                `「${escapeHTML(
                    prize.name
                )}」還需要抽出 <b>${remaining}</b> 人，但目前只有 <b>${state.participants.length}</b> 人。<br><br>你可以新增參加者，或修改設定中的抽出人數。`,
                "⚠️"
            );


            return;

        }


        /*
            300ms 後再抽下一人。

            注意：

            state.participants
            已經移除了上一位得獎者。

            因此下一次轉盤絕對不會再抽到他。
        */

        setTimeout(
            () => {

                spinOnce();

            },
            300
        );


        return;

    }



    /* =====================================================
       這個獎項全部抽完
    ===================================================== */

    updateInterface();


    showWinnerModal();

}



/* =============================================================
   得獎視窗
============================================================= */

function showWinnerModal() {


    const prize =
        state.prizes[
            state.currentPrizeIndex
        ];


    const winnerTitle =
        document.getElementById(
            "winnerTitle"
        );


    const winnerPrize =
        document.getElementById(
            "winnerPrize"
        );


    const winnerList =
        document.getElementById(
            "winnerList"
        );


    /*
        一人
    */

    if (
        state.currentPrizeWinners.length === 1
    ) {

        winnerTitle.textContent =
            "🎉 恭喜中獎！";

    }
    else {

        winnerTitle.textContent =
            "🎉 恭喜以下得獎者！";

    }


    winnerPrize.textContent =
        `獲得「${prize.name}」`;


    winnerList.innerHTML =
        "";


    state.currentPrizeWinners
        .forEach(
            winner => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "winner-name";


                element.textContent =
                    winner.name;


                winnerList.appendChild(
                    element
                );

            }
        );


    createConfetti();


    openModal(
        "winnerModal"
    );

}



/* =============================================================
   彩帶
============================================================= */

function createConfetti() {


    const container =
        document.getElementById(
            "confettiContainer"
        );


    container.innerHTML =
        "";


    const colors = [

        "#ff6b5e",
        "#ffc247",
        "#5cc98a",
        "#59a9e8",
        "#b678dc"

    ];


    for (
        let i = 0;
        i < 80;
        i++
    ) {


        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            `${Math.random() * 100}%`;


        piece.style.width =
            `${6 + Math.random() * 7}px`;


        piece.style.height =
            `${9 + Math.random() * 9}px`;


        piece.style.background =
            colors[
                i % colors.length
            ];


        piece.style.animationDelay =
            `${Math.random() * 0.3}s`;


        piece.style.animationDuration =
            `${1.3 + Math.random() * 1.2}s`;


        container.appendChild(
            piece
        );

    }


    setTimeout(
        () => {

            container.innerHTML =
                "";

        },
        2800
    );

}



/* =============================================================
   繼續按鈕
============================================================= */

document
    .getElementById(
        "continueButton"
    )
    .addEventListener(
        "click",
        () => {


            closeModal(
                "winnerModal"
            );


            /*
                還有下一個獎項。
            */

            if (
                state.currentPrizeIndex <
                state.prizes.length - 1
            ) {


                state.currentPrizeIndex++;


                state.currentPrizeDrawn =
                    0;


                state.currentPrizeWinners =
                    [];


                /*
                    下一個獎項從新的 0 度開始。
                */

                state.wheelRotation =
                    0;


                wheel.style.transition =
                    "none";


                wheel.style.transform =
                    "rotate(0deg)";


                renderWheel();

                updateInterface();


                return;

            }


            /*
                三個獎項全部完成。
            */

            finishRound();

        }
    );



/* =============================================================
   完成整輪抽獎
============================================================= */

function finishRound() {


    /*
        恢復這一輪的參加者。

        包含：

        1. 原本的人
        2. 中途新增的人
        3. 所有得獎者

        但如果使用者中途手動刪除某人，
        那個人已經從 restore list 移除了。
    */

    state.participants =
        [...state.roundRestoreParticipants];


    /*
        回到大獎。
    */

    state.currentPrizeIndex =
        0;


    state.currentPrizeDrawn =
        0;


    state.currentPrizeWinners =
        [];


    /*
        清除一輪資料。
    */

    state.roundRestoreParticipants =
        [];


    state.roundActive =
        false;


    /*
        轉盤回到原點。
    */

    state.wheelRotation =
        0;


    state.spinning =
        false;


    wheel.style.transition =
        "none";


    wheel.style.transform =
        "rotate(0deg)";


    /*
        更新。
    */

    renderNames();

    renderWheel();

    updateInterface();


    /*
        顯示完成。
    */

    showNotice(
        "所有獎項已抽完！",
        "本輪抽獎已全部完成。<br><br>得獎者已重新加入參加者名單，現在可以重新從大獎開始抽獎。",
        "🎊"
    );

}



/* =============================================================
   Modal 外部
============================================================= */

document
    .querySelectorAll(
        ".modal-overlay"
    )
    .forEach(
        overlay => {

            overlay.addEventListener(
                "click",
                event => {


                    if (
                        event.target !==
                        overlay
                    ) {

                        return;

                    }


                    /*
                        新增與設定可以點外面關閉。
                    */

                    if (
                        overlay.id ===
                        "addModal"
                    ) {

                        closeModal(
                            "addModal"
                        );

                    }


                    if (
                        overlay.id ===
                        "settingsModal"
                    ) {

                        closeModal(
                            "settingsModal"
                        );

                    }

                }
            );

        }
    );



/* =============================================================
   ESC
============================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (
            event.key !==
            "Escape"
        ) {

            return;

        }


        closeModal(
            "addModal"
        );


        closeModal(
            "settingsModal"
        );

    }
);



/* =============================================================
   初始化
============================================================= */

renderNames();

renderWheel();

updateInterface();

</script>
